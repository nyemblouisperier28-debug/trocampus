services:
  db:
    image: postgres:17-alpine
    container_name: trocampus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trocadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-trocampus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trocampus-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: trocampus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD dans .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD dans .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - trocampus-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./Trocampus.Api
      dockerfile: Dockerfile
    container_name: trocampus-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-trocampus};Username=${POSTGRES_USER:-trocadmin};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD dans .env}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Define REDIS_PASSWORD dans .env},abortConnect=false
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  trocampus-postgres:
  trocampus-redis:


