version: '3.8'
services:
  db:
    image: postgres:15
    container_name: trocampus_db
    environment:
      POSTGRES_USER: trocadmin
      POSTGRES_PASSWORD: trocpass
      POSTGRES_DB: trocampus
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql


